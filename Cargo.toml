[package]
name = "hbp100"
version = "3.0.1+py"
edition = "2021"
authors = ["Dipanjan Dutta <relic.of.sky@gmail.com>"]
description = "Hbp100: privacy preserving system for llm"
license = "MIT"
keywords = ["privacy", "pii", "masking", "llm", "security"]
categories = ["privacy", "natural-language", "machine-learning"]

[lib]
name = "hbp100"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.10"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
lazy_static = "1.4"
cached = "0.46"
chrono = "0.4"  
lightgbm3 = "1.0.10"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"]}

[dev-dependencies]
pretty_assertions = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bin]]
name = "test"
path = "dev/test.rs"
publish = false