[package]
name = "humming-bird"
version = "3.0.0"
edition = "2021"
authors = ["Dipanjan Dutta <relic.of.sky@.com>"]
description = "HBP100: privacy preserving firewall for llm"
license = "MIT"

[lib]
name = "hbp100"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.10"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
lazy_static = "1.4"
cached = "0.46"
chrono = "0.4"  
lightgbm3 = "1.0.10"

[dev-dependencies]
pretty_assertions = "1.0"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[bin]]
name = "train"
path = "dev/train.rs"
